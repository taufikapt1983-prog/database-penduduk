<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tambah Penduduk</title>
</head>

<body>

<h1>Tambah Penduduk</h1>

<label>NIK</label><br>
<input id="nik"><br><br>

<label>No KK</label><br>
<input id="no_kk"><br><br>

<label>Nama Lengkap</label><br>
<input id="nama"><br><br>

<label>Jenis Kelamin</label><br>
<select id="jk">
    <option>Laki-Laki</option>
    <option>Perempuan</option>
</select><br><br>

<label>Tempat Lahir</label><br>
<input id="tempat_lahir"><br><br>

<label>Tanggal Lahir</label><br>
<input type="date" id="tanggal_lahir"><br><br>

<label>Agama</label><br>
<select id="agama">
    <option>ISLAM</option>
    <option>KRISTEN</option>
    <option>KATOLIK</option>
    <option>HINDU</option>
    <option>BUDDHA</option>
    <option>KONGHUCU</option>
</select><br><br>

<label>Pendidikan</label><br>
<input id="pendidikan"><br><br>

<label>Pekerjaan</label><br>
<input id="pekerjaan"><br><br>

<label>Status Kawin</label><br>
<select id="status_kawin">
    <option>BELUM KAWIN</option>
    <option>KAWIN</option>
    <option>CERAI HIDUP</option>
    <option>CERAI MATI</option>
</select><br><br>

<label>Status Hubungan</label><br>
<select id="status_hubungan">
    <option>KEPALA KELUARGA</option>
    <option>ISTRI</option>
    <option>ANAK</option>
    <option>FAMILI LAIN</option>
</select><br><br>

<label>Kewarganegaraan</label><br>
<select id="kewarganegaraan">
    <option>WNI</option>
    <option>WNA</option>
</select><br><br>

<label>Alamat</label><br>
<input id="alamat"><br><br>

<label>RT</label><br>
<input id="rt"><br><br>

<label>RW</label><br>
<input id="rw"><br><br>

<label>Dusun</label><br>
<input id="dusun"><br><br>

<label>Desa</label><br>
<input id="desa"><br><br>

<label>Kecamatan</label><br>
<input id="kecamatan"><br><br>

<label>Kabupaten</label><br>
<input id="kabupaten"><br><br>

<label>Status Penduduk</label><br>
<select id="status_penduduk">
    <option>AKTIF</option>
    <option>MENINGGAL</option>
    <option>PINDAH</option>
</select><br><br>

<label>No HP</label><br>
<input id="no_hp"><br><br>

<label>BPJS</label><br>
<input id="bpjs"><br><br>

<label>Koordinat Rumah</label><br>
<input id="koordinat_rumah"><br><br>

<label>Foto Rumah (URL)</label><br>
<input id="foto_rumah"><br><br>

<button onclick="simpanPenduduk()">
    Simpan
</button>

<div id="hasil"></div>

<script src="js/tambah-penduduk.js"></script>

</body>
</html>
